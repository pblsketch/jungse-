<!doctype html>
<!-- 링크 공유 썸네일(assets/ui/og.jpg) 바탕: tools/make_og.mjs 가 이 쪽을 1200×630 으로 찍는다. 그림 원본 design/art/og-art.jpg -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #1d1a17; }
  #card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: url('../../design/art/og-art.jpg') center / cover no-repeat; }
  #card::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 52% 62% at 80% 30%, rgba(20, 14, 30, .62) 0%, rgba(20, 14, 30, .38) 45%, rgba(20, 14, 30, 0) 75%); }
  .box { position: absolute; right: 56px; top: 44px; text-align: right; color: #fff8ea; }
  .seal { display: inline-block; font-family: 'NMYet', serif; font-size: 26px; color: #fff; background: #b8322a;
    padding: 4px 12px 6px; border-radius: 6px; letter-spacing: .08em; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .title { font-family: 'NMYet', 'NMYetExt', serif; font-size: 112px; line-height: 1.12; margin: 12px 0 6px; letter-spacing: .02em;
    text-shadow: 0 3px 0 rgba(40, 20, 10, .55), 0 6px 24px rgba(0, 0, 0, .55); }
  .sub { font-family: 'NMSans', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.35; text-shadow: 0 2px 12px rgba(0, 0, 0, .7); }
  .meta { font-family: 'NMSans', sans-serif; font-size: 24px; margin-top: 10px; opacity: .92; text-shadow: 0 2px 10px rgba(0, 0, 0, .7); }
</style>
</head>
<body>
  <div id="card">
    <div class="box">
      <span class="seal" id="seal"></span>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</body>
</html>
