<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 모든 상대 경로를 저장소 뿌리 기준으로 -->
  <base href="../../">
  <title>옛한글 표기 검수</title>
  <link rel="icon" href="data:,">
  <!--
    옛한글·한자·루비·방점 화면 검수 페이지 (점검·검수 도구 — 게임 화면 아님).
    index.html 의 스타일·스크립트를 그대로 읽어(main.js 만 빼고) 실제 그리기 코드로 데이터의 표기 글을 모두 그린다.
      ?sec=orig      NM.data.ORIG 원문 카드 전부 (NM.ui.marker.orig)
      ?sec=scenes    장면 데이터(학교급 판 포함)의 표기 글: 대사·항목 이름표·카드·풀이·알아 두기·게임 설정 카드
      ?sec=data      규칙 카드 · 옛글자 도감 · 오답 카드 · 기믹 문구
      ?sec=ui        첫 화면 제목 · 장면 고르기 카드 · 진행표(HUD) · 수첩 · 수첩 이미지(캔버스)
      ?sec=gimmicks  장면의 기믹 과제를 실제 기믹으로 그린다(처음 화면 + 정답 화면)
      &fs=1.5        글자 크기(설정 '크게' = 1.5)   &bj=off  방점 끄기
    window.__auditReady = true 가 되면 다 그린 것. window.__audit() → 자동 탐지 결과(tests/qa/yet-audit.mjs, tests/checks/yet-render-browser.mjs).
  -->
  <style>
    html, body { height: auto; background: #d9d2c5; }
    #app { position: static; height: auto; overflow: visible; }
    #ui-layer { position: static; pointer-events: auto; }
    #ui-layer > .nm-overlay-host { position: static; display: block; background: none; }
    #ui-layer > .nm-overlay-host > .nm-st-win { position: relative; inset: auto; margin: 10px auto; max-height: none; overflow: visible; }
    #ui-layer > .nm-st-hud { position: relative; left: auto; top: auto; margin: 10px; max-height: none; display: inline-block; vertical-align: top; }
    #nm-screens { position: static; overflow: visible; }
    .nm-modal { position: static; display: block; max-width: 760px; margin: 10px auto; padding: 1em; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; font-size: calc(16px * var(--fs, 1)); line-height: 1.55; }
    .ya-h { font: 700 15px/1.3 var(--font-ui); color: #fff; background: #4a3f37; padding: 6px 10px; margin: 18px 0 0; }
    .ya-path { font: 11px/1.3 monospace; color: #6b5d52; margin: .2em 0 0; overflow-wrap: anywhere; }
    .ya-row { margin: .45em 0; }
    .ya-canvas { display: block; max-width: 100%; margin: 10px auto; border: 1px solid #999; }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui-layer"></div>
  </div>
  <script src="tests/pages/yet-audit.js"></script>
</body>
</html>
