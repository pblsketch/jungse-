# 올릴 때 점검 (spec §18-1 브라우저 없는 점검 1~5). push 와 pull request 마다 돈다.
# 이 컴퓨터에서 같은 명령으로 확인한다:  node tests/run-all.mjs --no-browser
# - 의존 패키지 없이 Node 로만 돈다(npm install 없음). 브라우저 점검(*-browser.mjs)은 건너뛴다.
# - a1-sprite-pipeline.mjs(그림 도구 점검)는 Python 3 + numpy + Pillow 가 필요해 여기서 설치한다(건너뛰지 않음).
# - 장면 데이터가 아직 없는 장면은 '없음'으로 보고만 한다. 다 채운 뒤에는 --require-all-scenes 를 덧붙인다(Q1·DEP1).
# - GitHub 에서의 첫 실행 확인은 공개 때(DEP1) 한다.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browserless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages for tools/process_sprites.py
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0
      - name: Browserless checks
        run: node tests/run-all.mjs --no-browser
